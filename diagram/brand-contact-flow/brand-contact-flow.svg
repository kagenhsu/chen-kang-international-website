<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">辰漮國際品牌接觸五步驟</title>
  <desc id="diagram-desc">橫向流程圖，由左到右依序為清楚的資訊整理、一致的品牌視覺、順暢的聯絡入口、完整的合作路徑與真誠的專人服務。</desc>
  <defs>
    <linearGradient id="pageGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbfa"/>
      <stop offset=".55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff8ed"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7b947"/>
      <stop offset=".28" stop-color="#168e85"/>
      <stop offset=".52" stop-color="#17699d"/>
      <stop offset=".76" stop-color="#d7194d"/>
      <stop offset="1" stop-color="#79a62c"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0c3553" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9bb6ba"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .eyebrow{font-size:14px;font-weight:900;letter-spacing:.22em;fill:#168e85}
    .title{font-size:36px;font-weight:900;letter-spacing:.08em;fill:#0c3553}
    .subtitle{font-size:17px;font-weight:500;letter-spacing:.08em;fill:#718089}
    .number{font-size:15px;font-weight:900;fill:#fff}
    .phase{font-size:12px;font-weight:900;letter-spacing:.12em}
    .step-title{font-size:21px;font-weight:900;letter-spacing:.04em;fill:#0c3553}
    .step-copy{font-size:14px;font-weight:500;fill:#687983}
    .icon{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <rect width="1280" height="520" rx="32" fill="url(#pageGlow)"/>
  <circle cx="70" cy="58" r="105" fill="#d7194d" opacity=".045"/>
  <circle cx="1215" cy="50" r="130" fill="#168e85" opacity=".05"/>
  <path d="M62 43 H205" stroke="#d7194d" stroke-width="5" stroke-linecap="round"/>
  <text x="62" y="78" class="eyebrow">BRAND CONTACT JOURNEY</text>
  <text x="62" y="121" class="title">品牌接觸五步驟</text>
  <text x="62" y="151" class="subtitle">從資訊整理，到長期合作</text>

  <path d="M246 305 H278 M496 305 H528 M746 305 H778 M996 305 H1028" fill="none" stroke="#9bb6ba" stroke-width="4" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <path d="M140 468 H1140" fill="none" stroke="url(#flowLine)" stroke-width="5" stroke-linecap="round" opacity=".55"/>

  <g filter="url(#cardShadow)">
    <rect x="30" y="180" width="216" height="270" rx="25" fill="#fff" stroke="#f7b947" stroke-width="4"/>
    <rect x="280" y="180" width="216" height="270" rx="25" fill="#fff" stroke="#168e85" stroke-width="4"/>
    <rect x="530" y="180" width="216" height="270" rx="25" fill="#fff" stroke="#17699d" stroke-width="4"/>
    <rect x="780" y="180" width="216" height="270" rx="25" fill="#fff" stroke="#d7194d" stroke-width="4"/>
    <rect x="1030" y="180" width="216" height="270" rx="25" fill="#fff" stroke="#79a62c" stroke-width="4"/>
  </g>

  <g>
    <circle cx="58" cy="199" r="22" fill="#f7b947" stroke="#fff" stroke-width="5"/>
    <text x="58" y="200" text-anchor="middle" dominant-baseline="middle" class="number">01</text>
    <circle cx="138" cy="237" r="35" fill="#f7b947"/>
    <path d="M119 226h38v24h-38zM125 233h17M125 241h25M125 248h20" class="icon"/>
    <text x="138" y="296" text-anchor="middle" class="phase" fill="#bd7e08">認識</text>
    <text x="138" y="329" text-anchor="middle" class="step-title">資訊整理</text>
    <text x="138" y="368" text-anchor="middle" class="step-copy">把服務價值</text>
    <text x="138" y="392" text-anchor="middle" class="step-copy">整理得清楚易懂</text>
  </g>

  <g>
    <circle cx="308" cy="199" r="22" fill="#168e85" stroke="#fff" stroke-width="5"/>
    <text x="308" y="200" text-anchor="middle" dominant-baseline="middle" class="number">02</text>
    <circle cx="388" cy="237" r="35" fill="#168e85"/>
    <path d="M371 221h34v30h-34zM371 229h34M378 239h7v7h-7zM391 239h8M391 246h8" class="icon"/>
    <text x="388" y="296" text-anchor="middle" class="phase" fill="#168e85">建立印象</text>
    <text x="388" y="329" text-anchor="middle" class="step-title">品牌視覺</text>
    <text x="388" y="368" text-anchor="middle" class="step-copy">讓名片與網站</text>
    <text x="388" y="392" text-anchor="middle" class="step-copy">呈現一致品牌印象</text>
  </g>

  <g>
    <circle cx="558" cy="199" r="22" fill="#17699d" stroke="#fff" stroke-width="5"/>
    <text x="558" y="200" text-anchor="middle" dominant-baseline="middle" class="number">03</text>
    <circle cx="638" cy="237" r="35" fill="#17699d"/>
    <path d="M625 216h21c5 0 9 4 9 9v10c0 5-4 9-9 9h-8l-9 8 2-8h-6c-5 0-9-4-9-9v-10c0-5 4-9 9-9zM625 228h21M625 236h14" class="icon"/>
    <text x="638" y="296" text-anchor="middle" class="phase" fill="#17699d">開始行動</text>
    <text x="638" y="329" text-anchor="middle" class="step-title">聯絡入口</text>
    <text x="638" y="368" text-anchor="middle" class="step-copy">用 LINE 與電話</text>
    <text x="638" y="392" text-anchor="middle" class="step-copy">提供順暢聯絡方式</text>
  </g>

  <g>
    <circle cx="808" cy="199" r="22" fill="#d7194d" stroke="#fff" stroke-width="5"/>
    <text x="808" y="200" text-anchor="middle" dominant-baseline="middle" class="number">04</text>
    <circle cx="888" cy="237" r="35" fill="#d7194d"/>
    <path d="M869 249v-22h12M907 249v-22h-12M878 218l10-8 10 8M878 236l10 9 10-9" class="icon"/>
    <text x="888" y="296" text-anchor="middle" class="phase" fill="#d7194d">延伸合作</text>
    <text x="888" y="329" text-anchor="middle" class="step-title">合作路徑</text>
    <text x="888" y="368" text-anchor="middle" class="step-copy">從接觸延伸到網站</text>
    <text x="888" y="392" text-anchor="middle" class="step-copy">曝光與多元合作</text>
  </g>

  <g>
    <circle cx="1058" cy="199" r="22" fill="#79a62c" stroke="#fff" stroke-width="5"/>
    <text x="1058" y="200" text-anchor="middle" dominant-baseline="middle" class="number">05</text>
    <circle cx="1138" cy="237" r="35" fill="#79a62c"/>
    <circle cx="1138" cy="227" r="9" class="icon"/>
    <path d="M1120 252c3-13 12-18 18-18s15 5 18 18M1116 224l-7 7 7 7M1160 224l7 7-7 7" class="icon"/>
    <text x="1138" y="296" text-anchor="middle" class="phase" fill="#6e9828">長期陪伴</text>
    <text x="1138" y="329" text-anchor="middle" class="step-title">專人服務</text>
    <text x="1138" y="368" text-anchor="middle" class="step-copy">先理解實際需求</text>
    <text x="1138" y="392" text-anchor="middle" class="step-copy">再建議適合的做法</text>
  </g>
</svg>
