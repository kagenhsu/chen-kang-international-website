<svg viewBox="0 0 1300 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">辰漮國際品牌接觸流程</title>
  <desc id="diagram-desc">從清楚的資訊整理、一致的品牌視覺、順暢的聯絡入口、完整的合作路徑，到真誠的專人服務，共五個步驟。</desc>
  <defs>
    <linearGradient id="pageGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbfa"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff8ed"/>
    </linearGradient>
    <linearGradient id="brandFlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#168e85"/>
      <stop offset="0.55" stop-color="#0c6581"/>
      <stop offset="1" stop-color="#d7194d"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0c3553" flood-opacity="0.09"/>
    </filter>
    <marker id="flowArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#168e85"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft JhengHei', sans-serif; }
      .title { fill:#0c3553; font-size:34px; font-weight:700; letter-spacing:3px; }
      .subtitle { fill:#718089; font-size:17px; font-weight:400; letter-spacing:2px; }
      .step-title { fill:#0c3553; font-size:22px; font-weight:700; letter-spacing:1.2px; }
      .step-copy { fill:#667780; font-size:15px; font-weight:400; }
      .step-no { fill:#ffffff; font-size:18px; font-weight:700; }
      .phase { font-size:12px; font-weight:700; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="1300" height="980" rx="32" fill="url(#pageGlow)"/>
  <path d="M86 48 H260" stroke="#d7194d" stroke-width="5" stroke-linecap="round"/>
  <text x="86" y="94" class="title">品牌接觸流程</text>
  <text x="86" y="126" class="subtitle">從資訊整理，到長期合作</text>

  <!-- flow connectors -->
  <path d="M650 205 V312" fill="none" stroke="url(#brandFlow)" stroke-width="5" stroke-linecap="round" marker-end="url(#flowArrow)"/>
  <path d="M650 365 V472" fill="none" stroke="url(#brandFlow)" stroke-width="5" stroke-linecap="round" marker-end="url(#flowArrow)"/>
  <path d="M650 525 V632" fill="none" stroke="url(#brandFlow)" stroke-width="5" stroke-linecap="round" marker-end="url(#flowArrow)"/>
  <path d="M650 685 V792" fill="none" stroke="url(#brandFlow)" stroke-width="5" stroke-linecap="round" marker-end="url(#flowArrow)"/>

  <!-- card masks -->
  <g fill="#ffffff">
    <rect x="70" y="155" width="500" height="128" rx="22"/>
    <rect x="730" y="315" width="500" height="128" rx="22"/>
    <rect x="70" y="475" width="500" height="128" rx="22"/>
    <rect x="730" y="635" width="500" height="128" rx="22"/>
    <rect x="70" y="795" width="500" height="128" rx="22"/>
  </g>

  <!-- horizontal links -->
  <g fill="none" stroke="#b7c8cb" stroke-width="3" stroke-linecap="round">
    <path d="M570 219 H615"/>
    <path d="M685 379 H730"/>
    <path d="M570 539 H615"/>
    <path d="M685 699 H730"/>
    <path d="M570 859 H615"/>
  </g>

  <!-- cards -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="155" width="500" height="128" rx="22" fill="#ffffff" stroke="#dce9e8" stroke-width="2"/>
    <rect x="70" y="155" width="9" height="128" rx="4.5" fill="#f7b947"/>
    <rect x="730" y="315" width="500" height="128" rx="22" fill="#ffffff" stroke="#dce9e8" stroke-width="2"/>
    <rect x="1221" y="315" width="9" height="128" rx="4.5" fill="#168e85"/>
    <rect x="70" y="475" width="500" height="128" rx="22" fill="#ffffff" stroke="#dce9e8" stroke-width="2"/>
    <rect x="70" y="475" width="9" height="128" rx="4.5" fill="#17699d"/>
    <rect x="730" y="635" width="500" height="128" rx="22" fill="#ffffff" stroke="#dce9e8" stroke-width="2"/>
    <rect x="1221" y="635" width="9" height="128" rx="4.5" fill="#d7194d"/>
    <rect x="70" y="795" width="500" height="128" rx="22" fill="#ffffff" stroke="#dce9e8" stroke-width="2"/>
    <rect x="70" y="795" width="9" height="128" rx="4.5" fill="#a7cf45"/>
  </g>

  <!-- numbered nodes -->
  <g>
    <circle cx="650" cy="219" r="35" fill="#f7b947" stroke="#ffffff" stroke-width="8"/>
    <circle cx="650" cy="379" r="35" fill="#168e85" stroke="#ffffff" stroke-width="8"/>
    <circle cx="650" cy="539" r="35" fill="#17699d" stroke="#ffffff" stroke-width="8"/>
    <circle cx="650" cy="699" r="35" fill="#d7194d" stroke="#ffffff" stroke-width="8"/>
    <circle cx="650" cy="859" r="35" fill="#79a62c" stroke="#ffffff" stroke-width="8"/>
    <text x="650" y="225" text-anchor="middle" class="step-no">01</text>
    <text x="650" y="385" text-anchor="middle" class="step-no">02</text>
    <text x="650" y="545" text-anchor="middle" class="step-no">03</text>
    <text x="650" y="705" text-anchor="middle" class="step-no">04</text>
    <text x="650" y="865" text-anchor="middle" class="step-no">05</text>
  </g>

  <!-- labels -->
  <g>
    <text x="108" y="188" class="phase" fill="#bd7e08">認識</text>
    <text x="108" y="226" class="step-title">清楚的資訊整理</text>
    <text x="108" y="256" class="step-copy">把服務價值整理成客戶能快速理解的內容</text>

    <text x="768" y="348" class="phase" fill="#168e85">建立印象</text>
    <text x="768" y="386" class="step-title">一致的品牌視覺</text>
    <text x="768" y="416" class="step-copy">讓電子名片、網站與通路呈現同一個品牌印象</text>

    <text x="108" y="508" class="phase" fill="#17699d">開始行動</text>
    <text x="108" y="546" class="step-title">順暢的聯絡入口</text>
    <text x="108" y="576" class="step-copy">以 LINE 為主要行動，電話聯絡作為輔助</text>

    <text x="768" y="668" class="phase" fill="#d7194d">延伸合作</text>
    <text x="768" y="706" class="step-title">完整的合作路徑</text>
    <text x="768" y="736" class="step-copy">從初次接觸延伸到網站、曝光與多元合作</text>

    <text x="108" y="828" class="phase" fill="#6e9828">長期陪伴</text>
    <text x="108" y="866" class="step-title">真誠的專人服務</text>
    <text x="108" y="896" class="step-copy">先理解需求，再建議真正適合的做法</text>
  </g>
</svg>
