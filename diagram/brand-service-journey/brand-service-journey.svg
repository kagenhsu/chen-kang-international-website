<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">品牌成長服務路徑</title>
  <desc id="desc">辰漮國際從電子名片、官方網站、通路曝光到多元合作的四步驟品牌成長流程圖。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f31"/>
      <stop offset="1" stop-color="#0c3553"/>
    </linearGradient>
    <linearGradient id="titleLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7194d"/>
      <stop offset=".34" stop-color="#f7b947"/>
      <stop offset=".68" stop-color="#29a79b"/>
      <stop offset="1" stop-color="#36b56e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#00131f" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dce9eb"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
    .eyebrow{font-size:15px;font-weight:800;letter-spacing:.24em;fill:#f7b947}
    .title{font-size:40px;font-weight:900;letter-spacing:.06em;fill:#fff}
    .subtitle{font-size:18px;font-weight:500;letter-spacing:.08em;fill:#b9cad2}
    .step{font-size:16px;font-weight:900;fill:#fff}
    .cardTitle{font-size:27px;font-weight:900;letter-spacing:.08em;fill:#0c3553}
    .cardLead{font-size:18px;font-weight:800;fill:#334b5a}
    .cardText{font-size:15px;font-weight:500;fill:#687983}
    .icon{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <rect width="1280" height="470" rx="34" fill="url(#background)"/>
  <circle cx="70" cy="64" r="112" fill="#d7194d" opacity=".08"/>
  <circle cx="1220" cy="70" r="145" fill="#36b56e" opacity=".07"/>
  <path d="M65 130 H1215" stroke="url(#titleLine)" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  <text x="640" y="45" text-anchor="middle" class="eyebrow">CHEN KANG SERVICE JOURNEY</text>
  <text x="640" y="88" text-anchor="middle" class="title">品牌成長服務路徑</text>
  <text x="640" y="119" text-anchor="middle" class="subtitle">從第一次認識，到長期合作的完整接觸旅程</text>

  <path d="M322 326 H357 M622 326 H657 M922 326 H957" stroke="#dce9eb" stroke-width="4" stroke-dasharray="8 9" marker-end="url(#arrow)" opacity=".82"/>

  <g filter="url(#shadow)">
    <rect x="45" y="170" width="270" height="260" rx="28" fill="#fff"/>
    <rect x="345" y="170" width="270" height="260" rx="28" fill="#fff"/>
    <rect x="645" y="170" width="270" height="260" rx="28" fill="#fff"/>
    <rect x="945" y="170" width="270" height="260" rx="28" fill="#fff"/>
  </g>

  <g>
    <circle cx="180" cy="231" r="39" fill="#d7194d"/>
    <rect x="159" y="215" width="42" height="30" rx="4" class="icon"/>
    <circle cx="170" cy="225" r="5" class="icon"/>
    <path d="M163 239c3-7 12-7 15 0M184 222h12M184 231h12M184 239h8" class="icon"/>
    <circle cx="75" cy="190" r="25" fill="#d7194d"/>
    <text x="75" y="190" text-anchor="middle" dominant-baseline="middle" class="step">01</text>
    <text x="180" y="305" text-anchor="middle" class="cardTitle">電子名片</text>
    <text x="180" y="351" text-anchor="middle" class="cardLead">快速分享</text>
    <text x="180" y="383" text-anchor="middle" class="cardText">建立專業第一印象</text>
  </g>

  <g>
    <circle cx="480" cy="231" r="39" fill="#f28c45"/>
    <rect x="457" y="213" width="46" height="34" rx="4" class="icon"/>
    <path d="M457 222h46M466 217h1M473 217h1M481 217h1M466 231h27M466 238h18" class="icon"/>
    <circle cx="375" cy="190" r="25" fill="#f28c45"/>
    <text x="375" y="190" text-anchor="middle" dominant-baseline="middle" class="step">02</text>
    <text x="480" y="305" text-anchor="middle" class="cardTitle">官方網站</text>
    <text x="480" y="351" text-anchor="middle" class="cardLead">深入了解</text>
    <text x="480" y="383" text-anchor="middle" class="cardText">累積品牌信任</text>
  </g>

  <g>
    <circle cx="780" cy="231" r="39" fill="#168e85"/>
    <path d="M757 225h9l19-11v34l-19-11h-9zM763 237l4 14h10l-6-12M792 223c5 4 5 12 0 16" class="icon"/>
    <circle cx="675" cy="190" r="25" fill="#168e85"/>
    <text x="675" y="190" text-anchor="middle" dominant-baseline="middle" class="step">03</text>
    <text x="780" y="305" text-anchor="middle" class="cardTitle">通路曝光</text>
    <text x="780" y="351" text-anchor="middle" class="cardLead">擴大接觸</text>
    <text x="780" y="383" text-anchor="middle" class="cardText">讓更多人看見</text>
  </g>

  <g>
    <circle cx="1080" cy="231" r="39" fill="#36b56e"/>
    <path d="M1054 231l13-10 10 8 10-8 18 13M1058 235l16 15 6-6 6 5 17-16M1067 221l8-7 7 7" class="icon"/>
    <circle cx="975" cy="190" r="25" fill="#36b56e"/>
    <text x="975" y="190" text-anchor="middle" dominant-baseline="middle" class="step">04</text>
    <text x="1080" y="305" text-anchor="middle" class="cardTitle">多元合作</text>
    <text x="1080" y="351" text-anchor="middle" class="cardLead">串連資源</text>
    <text x="1080" y="383" text-anchor="middle" class="cardText">創造長期機會</text>
  </g>
</svg>
