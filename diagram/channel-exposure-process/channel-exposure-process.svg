<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">通路曝光三步驟</title>
  <desc id="description">從確認適合對象、整理曝光內容，到媒合合作通路的完整流程圖。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf8f5"/>
      <stop offset="0.56" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff6e8"/>
    </linearGradient>
    <linearGradient id="step1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#168e85"/>
      <stop offset="1" stop-color="#0c5266"/>
    </linearGradient>
    <linearGradient id="step2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7194d"/>
      <stop offset="1" stop-color="#a51d37"/>
    </linearGradient>
    <linearGradient id="step3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17699d"/>
      <stop offset="1" stop-color="#0c3553"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0c3553" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0 0L12 5L0 10Z" fill="#f7b947"/>
    </marker>
    <style>
      text{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif}
      .kicker{font-size:15px;font-weight:800;letter-spacing:4px;fill:#168e85}
      .title{font-size:36px;font-weight:900;fill:#0c3553}
      .subtitle{font-size:16px;font-weight:500;fill:#6d7d86}
      .step-number{font-size:18px;font-weight:900;fill:#0c3553}
      .step-title{font-size:25px;font-weight:900;fill:#0c3553}
      .step-summary{font-size:14px;font-weight:500;fill:#697b85}
      .bullet{font-size:15px;font-weight:700;fill:#314854}
      .icon-line{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .arrow-label{font-size:12px;font-weight:800;fill:#a87415;letter-spacing:2px}
    </style>
  </defs>

  <rect width="1200" height="560" rx="34" fill="url(#background)"/>
  <circle cx="1125" cy="55" r="112" fill="#a7cf45" opacity="0.12"/>
  <circle cx="45" cy="520" r="120" fill="#d7194d" opacity="0.07"/>

  <text x="600" y="50" text-anchor="middle" class="kicker">CHANNEL EXPOSURE PROCESS</text>
  <text x="600" y="94" text-anchor="middle" class="title">通路曝光三步驟</text>
  <text x="600" y="124" text-anchor="middle" class="subtitle">從了解需求、整理內容，到串連適合的合作通路</text>

  <path d="M374 322H438" stroke="#f7b947" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="406" y="302" text-anchor="middle" class="arrow-label">整理</text>
  <path d="M754 322H818" stroke="#f7b947" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="786" y="302" text-anchor="middle" class="arrow-label">媒合</text>

  <g filter="url(#shadow)">
    <rect x="55" y="165" width="320" height="330" rx="28" fill="#fff"/>
    <rect x="55" y="165" width="320" height="105" rx="28" fill="url(#step1)"/>
    <rect x="55" y="240" width="320" height="30" fill="url(#step1)"/>
    <circle cx="109" cy="218" r="34" fill="#fff" opacity="0.16"/>
    <circle cx="109" cy="218" r="22" class="icon-line"/>
    <path d="M93 218h32M109 202v32" class="icon-line"/>
    <rect x="303" y="187" width="48" height="36" rx="18" fill="#f7b947"/>
    <text x="327" y="211" text-anchor="middle" class="step-number">01</text>
    <text x="83" y="315" class="step-title">確認適合對象</text>
    <text x="83" y="342" class="step-summary">先理解品牌與想接觸的顧客</text>
    <circle cx="91" cy="385" r="5" fill="#168e85"/><text x="108" y="391" class="bullet">了解品牌定位</text>
    <circle cx="91" cy="425" r="5" fill="#168e85"/><text x="108" y="431" class="bullet">盤點產品服務</text>
    <circle cx="91" cy="465" r="5" fill="#168e85"/><text x="108" y="471" class="bullet">確認目標客群</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="165" width="320" height="330" rx="28" fill="#fff"/>
    <rect x="435" y="165" width="320" height="105" rx="28" fill="url(#step2)"/>
    <rect x="435" y="240" width="320" height="30" fill="url(#step2)"/>
    <circle cx="489" cy="218" r="34" fill="#fff" opacity="0.16"/>
    <rect x="475" y="201" width="28" height="34" rx="3" class="icon-line"/>
    <path d="M482 211h14M482 220h14M482 229h9" class="icon-line"/>
    <rect x="683" y="187" width="48" height="36" rx="18" fill="#f7b947"/>
    <text x="707" y="211" text-anchor="middle" class="step-number">02</text>
    <text x="463" y="315" class="step-title">整理曝光內容</text>
    <text x="463" y="342" class="step-summary">把服務整理成容易理解的素材</text>
    <circle cx="471" cy="385" r="5" fill="#d7194d"/><text x="488" y="391" class="bullet">準備品牌圖文</text>
    <circle cx="471" cy="425" r="5" fill="#d7194d"/><text x="488" y="431" class="bullet">建立清楚賣點</text>
    <circle cx="471" cy="465" r="5" fill="#d7194d"/><text x="488" y="471" class="bullet">放入聯絡方式</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="815" y="165" width="330" height="330" rx="28" fill="#fff"/>
    <rect x="815" y="165" width="330" height="105" rx="28" fill="url(#step3)"/>
    <rect x="815" y="240" width="330" height="30" fill="url(#step3)"/>
    <circle cx="869" cy="218" r="34" fill="#fff" opacity="0.16"/>
    <circle cx="856" cy="210" r="7" class="icon-line"/>
    <circle cx="883" cy="210" r="7" class="icon-line"/>
    <circle cx="869" cy="232" r="7" class="icon-line"/>
    <path d="M862 216l5 10M876 216l-5 10" class="icon-line"/>
    <rect x="1073" y="187" width="48" height="36" rx="18" fill="#f7b947"/>
    <text x="1097" y="211" text-anchor="middle" class="step-number">03</text>
    <text x="843" y="315" class="step-title">媒合合作通路</text>
    <text x="843" y="342" class="step-summary">依資源安排曝光並引導聯絡</text>
    <circle cx="851" cy="385" r="5" fill="#17699d"/><text x="868" y="391" class="bullet">評估適合資源</text>
    <circle cx="851" cy="425" r="5" fill="#17699d"/><text x="868" y="431" class="bullet">安排曝光串連</text>
    <circle cx="851" cy="465" r="5" fill="#17699d"/><text x="868" y="471" class="bullet">引導顧客聯絡</text>
  </g>

  <rect x="426" y="520" width="348" height="24" rx="12" fill="#0c3553" opacity="0.08"/>
  <text x="600" y="538" text-anchor="middle" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700" fill="#60737d">清楚對象 × 完整內容 × 適合通路</text>
</svg>
